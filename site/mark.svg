<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 350 744 324" width="744" height="324">
  <title>VisorVR</title>
  <!--
    The visor glyph on its own, for use on the page itself.

    favicon.svg is the same mark on its dark rounded plate, which is right for a
    browser tab sitting on an unknown background - but on this site's own dark
    nav the plate disappears and the icon reads as an empty outlined box. Same
    geometry, same coordinates as assets/VisorVR_Icon.svg, minus the plate.
  -->
  <defs>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F95FF"/>
      <stop offset="1" stop-color="#5C64E6"/>
    </linearGradient>
    <mask id="notch">
      <rect x="0" y="0" width="1024" height="1024" fill="black"/>
      <rect x="152" y="362" width="720" height="300" rx="150" fill="white"/>
      <ellipse cx="512" cy="700" rx="150" ry="95" fill="black"/>
    </mask>
    <clipPath id="visorClip">
      <rect x="152" y="362" width="720" height="300" rx="150"/>
    </clipPath>
  </defs>

  <rect x="152" y="362" width="720" height="300" rx="150"
        fill="url(#visor)" mask="url(#notch)"/>
  <rect x="210" y="405" width="604" height="60" rx="30"
        fill="#ffffff" fill-opacity="0.27" clip-path="url(#visorClip)"/>
</svg>
