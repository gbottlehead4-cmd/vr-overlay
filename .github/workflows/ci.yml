name: Build and Package
on:
  pull_request:
    paths:
      - "assets/**"
      - "installer/**"
      - "src/**"
      - "third-party/**"
      - "*.props"
      - "*.cmake"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  push:
    paths:
      - "assets/**"
      - "installer/**"
      - "src/**"
      - "third-party/**"
      - "*.props"
      - "*.cmake"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
permissions:
  # Declaring any permission drops every unlisted one to none, so checkout
  # needs this spelled out. Upstream gets away without it because their
  # repository is public and checkout falls back to anonymous access.
  contents: read
  packages: write
env:
  USERNAME: ${{github.repository_owner}}
  FEED_URL: https://nuget.pkg.github.com/${{github.repository_owner}}/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{github.repository_owner}}/index.json,${{ github.event_name == 'push' && 'readwrite' || 'read' }}"
jobs:
  populate-vcpkg-cache:
    name: Populate vcpkg cache (${{matrix.triplet}})
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - triplet: x64-windows-visorvr
            extra: ""
          - triplet: x86-windows-static
            extra: "--x-no-default-features"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: third-party/vcpkg/bootstrap-vcpkg.bat
      - name: Add nuget source
        shell: pwsh
        run: |
          .$(third-party/vcpkg/vcpkg fetch nuget) `
            sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(third-party/vcpkg/vcpkg fetch nuget) `
            setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "${{ env.FEED_URL }}"
      - name: "Install dependencies"
        run: third-party/vcpkg/vcpkg install --triplet ${{matrix.triplet}} --clean-after-build ${{matrix.extra}}
  build:
    name: Build (${{matrix.config}})
    needs: populate-vcpkg-cache
    if: always() && !failure() && !cancelled()
    runs-on: windows-2022
    strategy:
      matrix:
        config: [RelWithDebInfo, Debug]
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: source/third-party/vcpkg/bootstrap-vcpkg.bat
      - name: Add nuget vcpkg source
        shell: pwsh
        working-directory: source
        run: |
          .$(third-party/vcpkg/vcpkg fetch nuget) `
            sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
      - name: Make build directory
        run: cmake -E make_directory build
      - name: Configure
        working-directory: build
        shell: pwsh
        run: |
          cmake ${{github.workspace}}/source `
            -B ${{github.workspace}}/build `
            --preset vcpkg `
            "-DSOURCELINK=https://raw.githubusercontent.com/${{github.repository}}/${{github.sha}}"
      - name: Build
        id: build
        working-directory: build
        run: |
          # Build
          echo "::group::Running cmake --build"
          cmake --build . `
            --config ${{matrix.config}} `
            --parallel `
            -- `
            /p:CL_MPCount=
          echo "::endgroup::"
          echo "::group::Setting version"
          $version="$(Get-Content version.txt)"
          Add-Content $Env:GITHUB_OUTPUT "VERSION=${version}"
          echo "::endgroup::"
      # 422MB. Tags only - it is wanted when debugging a crash report against
      # a shipped build, not for every push.
      - name: Attach debug symbols
        if: ${{ matrix.config != 'Debug' && github.repository == 'gbottlehead4-cmd/vr-overlay' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: VisorVR-GHA${{github.run_number}}-DebugSymbols
          path: build/out/${{matrix.config}}/pdb
      - name: Build installer generator
        if: ${{matrix.config != 'Debug' }}
        shell: pwsh
        working-directory: source/VisorVR-Installer
        run: |
          dotnet publish `
            --configuration Release `
            --output "${{github.workspace}}/build/out/${{matrix.config}}/installer-generator"
      # 444MB - the same tree `scripts/make-portable.ps1` packages. Tags only,
      # for the same reason as the symbols above.
      - name: Attach bundle
        if: ${{ matrix.config != 'Debug' && github.repository == 'gbottlehead4-cmd/vr-overlay' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: VisorVR-GHA${{github.run_number}}
          path: |
            build/out/${{matrix.config}}
            !build/out/${{matrix.config}}/pdb
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          # Wix5 by default will pull in the Wix6 RC wixext, which isn't compatible
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build installer
        id: build-installer
        if: ${{matrix.config != 'Debug' }}
        shell: pwsh
        working-directory: build/out/${{matrix.config}}
        run: |
          installer-generator/VisorVR-Installer.exe `
            "$(Get-Location)" `
            --stamp-file ${{github.workspace}}/installer.stamp
          $InstallerPath = Get-Content ${{github.workspace}}/installer.stamp
          $InstallerName = (Get-Item $InstallerPath).Name
          Add-Content $env:GITHUB_OUTPUT "installer-path=${InstallerPath}"
          Add-Content $env:GITHUB_OUTPUT "installer-name=${InstallerName}"
      # The MSI, and the only small one of the three - so it uploads on
      # default-branch pushes too, not just tags.
      - name: Upload unsigned installer
        if: ${{ matrix.config != 'Debug' && github.repository == 'gbottlehead4-cmd/vr-overlay' && (github.ref == 'refs/heads/vr-edit-mode' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build-installer.outputs.installer-name}}
          path: ${{steps.build-installer.outputs.installer-path}}
      # No release steps here on purpose. Upstream drafted a release from
      # `.github/workflows/release_notes.md` on every tag; the Stage 2 rebrand
      # deleted that template but left the step reading it, so every tag build
      # has failed since - v1.13.1 and v1.14.0 both - on a missing file, after
      # the app and the installer had already built fine.
      #
      # Releases here are published by hand with `gh release create`, notes
      # written per release. An auto-drafted release would only collide with
      # that, so the steps are gone rather than repaired.